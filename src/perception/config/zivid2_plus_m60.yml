# Zivid 2+ M60 capture settings for the part-pose pipeline (#45, #249).
# NOT VALIDATED ON HARDWARE. Derived from the M70 file in the DASG subtree
# (crc_disassembly_sequence_generator/Zivid2_Settings_Zivid_Two_M70_ManufacturingSpecular.yml):
# same keys and the same acquisition values. Replace it with a file exported from
# Zivid Studio on the real M60 camera before relying on capture quality.
__version__:
    serializer: 1
    data: 20
Settings:
    Acquisitions:
        - Acquisition:
              Aperture: 6.73
              Brightness: 1.8
              ExposureTime: 1677
              Gain: 1
        - Acquisition:
              Aperture: 2.83
              Brightness: 1.8
              ExposureTime: 5000
              Gain: 1
        - Acquisition:
              Aperture: 2.59
              Brightness: 2.5
              ExposureTime: 10000
              Gain: 1
    Diagnostics:
        Enabled: no
    Experimental:
        Engine: stripe
    Processing:
        Color:
            Balance:
                Blue: 1
                Green: 1
                Red: 1
            Experimental:
                Mode: automatic
            Gamma: 0.8
        Filters:
            Cluster:
                Removal:
                    Enabled: yes
                    MaxNeighborDistance: 5
                    MinArea: 200
            Experimental:
                ContrastDistortion:
                    Correction:
                        Enabled: yes
                        Strength: 0.3
                    Removal:
                        Enabled: no
                        Threshold: 0.3
                HoleFilling:
                    Enabled: yes
                    HoleSize: 0.1
                    Strictness: 4
            Noise:
                Removal:
                    Enabled: yes
                    Threshold: 3
                Suppression:
                    Enabled: no
                Repair:
                    Enabled: no
            Outlier:
                Removal:
                    Enabled: yes
                    Threshold: 10
            Reflection:
                Removal:
                    Enabled: yes
                    Experimental:
                        Mode: global
            Smoothing:
                Gaussian:
                    Enabled: yes
                    Sigma: 1.75
    RegionOfInterest:
        Box:
            Enabled: no
            Extents: [-10, 100]
            PointA: [0, 0, 0]
            PointB: [0, 0, 0]
            PointO: [0, 0, 0]
        Depth:
            Enabled: no
            Range: [300, 1300]
    Sampling:
        Color: rgb
        Pixel: all
