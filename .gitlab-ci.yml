# Merge gate for agent and thesis MRs (ADR-0009). Runs on the KIT shared runners (Linux, CPU, 1 h per job).
# Gate on every MR and in the merge train: ruff on changed files, fast tests, >= 60 % of changed lines in src/ covered.
# Slow and geom tests run on main after a merge (manual on MRs); a red main pipeline opens a `ci::main-red` issue.
# GPU tests never run here (pytest marker `gpu`, run locally).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/        # Run pipeline button, or the API
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS  # the MR pipeline covers it
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^thesis\//               # feedback on every thesis push, before any MR
  auto_cancel:
    on_new_commit: interruptible

stages: [check, test, report]

default:
  image: ghcr.io/astral-sh/uv:0.12.1-python3.12-trixie
  interruptible: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libgl1 libegl1 libx11-6 libgomp1 libusb-1.0-0 libudev1 libidn2-0 > /dev/null  # open3d
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache, .pre-commit-cache]
  after_script:
    - uv cache prune --ci || true

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  UV_LINK_MODE: copy
  UV_PYTHON: "3.12"
  PRE_COMMIT_HOME: $CI_PROJECT_DIR/.pre-commit-cache
  FAST_TESTS: not slow and not geom and not gpu

# Paths the tests can depend on. An MR touching none of them (docs, ADRs, *.md, figures) runs lint only.
# Unknown .py files always count; add a new top-level code or data folder here.
.code-paths: &code-paths
  - "**/*.py"
  - "{src,tests,cases,benchmark_cases,examples,tools,emo_sr_v2}/**/*"
  - "{crc_disassembly_sequence_generator,crc_disassembly_sim,crc_diss_assembly_dataclasses}/**/*"
  - "{pyproject.toml,uv.lock,pytest.ini,.coveragerc,.gitattributes,.gitlab-ci.yml,.pre-commit-config.yaml}"

# Compare against main without the full history: the default shallow clone usually holds the merge base
# (MR pipelines run on a merge commit onto main); deepen only when it does not, e.g. an old thesis branch.
.fetch-main: &fetch-main
  - git fetch --quiet origin "+$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
  - git merge-base HEAD "origin/$CI_DEFAULT_BRANCH" > /dev/null || git fetch --quiet --unshallow origin

lint:
  stage: check
  variables:
    GIT_LFS_SKIP_SMUDGE: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^thesis\//
  before_script: []
  script:
    - *fetch-main
    - BASE=$(git merge-base "origin/$CI_DEFAULT_BRANCH" HEAD)
    - SKIP=check-absolute-paths uv run --locked --only-dev pre-commit run --from-ref "$BASE" --to-ref HEAD --show-diff-on-failure  # that hook has its own job below

# Absolute paths in tracked data files (AT 168): scans every tracked XML, URDF, SDF, xacro, JSON, YAML and INI file.
# Not part of the docs-only skip (data files are not docs). Standard library only, so no `uv sync`.
# The exclude list and its reasons live in tools/ci/check_absolute_paths.py (EXCLUDES).
absolute-paths:
  stage: check
  variables:
    GIT_LFS_SKIP_SMUDGE: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"  # includes the merge train
    - if: $CI_COMMIT_BRANCH =~ /^thesis\//
  before_script: []
  script:
    - python3 tools/ci/check_absolute_paths.py

# Fast tests, then the diff-cover gate in the same pod (one clone and LFS checkout fewer on the critical path).
# The tests run in parallel (pytest-xdist, AT 262), one worker per CPU of the job's cgroup limit, at least 2:
# not `-n auto`, which counts the host's CPUs (the KIT pod sees 10 but may use 1.2; the box runner gives 8).
# A PYTEST_WORKERS variable (pipeline, project or runner) overrides the count.
# The sysmon coverage core (Python 3.12) is cheaper; branch coverage is off, which sysmon cannot measure.
fast-tests:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes: *code-paths
  needs: []  # report test results even when lint fails
  variables:
    COVERAGE_CORE: sysmon
  script:
    - |
      { read -r quota period < /sys/fs/cgroup/cpu.max; } 2>/dev/null || quota=max
      if [ "$quota" = max ]; then cpus=$(nproc); else cpus=$(( (quota + period - 1) / period )); fi
      PYTEST_WORKERS=${PYTEST_WORKERS:-$(( cpus > 2 ? cpus : 2 ))}
      echo "runner: $CI_RUNNER_DESCRIPTION; nproc: $(nproc); cpu.max: $quota ${period:-}; workers: $PYTEST_WORKERS"
    - uv sync --locked
    - uv run pytest -q -p no:cacheprovider -m "$FAST_TESTS" -n "$PYTEST_WORKERS"
      --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
    - *fetch-main
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then  # gate MRs and thesis branches, not main itself
        uv run --locked --only-dev diff-cover coverage.xml --compare-branch="origin/$CI_DEFAULT_BRANCH" --fail-under=60
      fi
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths: [coverage.xml]

# On main after a merge it runs by itself and is not cancelled by the next merge, so a red main is reported
# (main-red-issue). The merge train keeps the fast stage only; on MRs and thesis branches it stays manual.
slow-tests:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: *code-paths
      interruptible: false
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: manual
      allow_failure: true
  timeout: 1h
  script:
    - uv sync --locked
    - uv run pytest -q -p no:cacheprovider -m "slow or geom" --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      junit: report.xml

# A failed job on main after a merge: one open `ci::main-red` issue holds it (a note when one is open already).
# Uses DRIFT_TOKEN, which the protected main branch can read; MAIN_RED_TOKEN overrides it if set.
main-red-issue:
  stage: report
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: on_failure
  interruptible: false
  variables:
    GIT_DEPTH: "1"
    GIT_LFS_SKIP_SMUDGE: "1"
  before_script: []
  after_script: []
  cache: []
  script:
    - python3 tools/ci/main_red_issue.py

# Scheduled every two weeks with DRIFT_CHECK=1; DRIFT_TOKEN is a project access token (api scope).
# A manual pipeline (Run pipeline, DRIFT_CHECK=1) on any branch tests the job; without the token it only prints.
thesis-drift:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/ && $DRIFT_CHECK == "1"
  interruptible: false
  timeout: 1h
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libgl1 libegl1 libx11-6 libgomp1 libusb-1.0-0 libudev1 libidn2-0 git-lfs > /dev/null
    - git lfs install --local
  script:
    - git fetch --quiet origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH" "+refs/heads/thesis/*:refs/remotes/origin/thesis/*"
    - python3 tools/ci/thesis_drift.py
