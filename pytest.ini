[pytest]
testpaths =
    tests
    crc_diss_assembly_dataclasses/tests

pythonpath =
    .
    src
    crc_diss_assembly_dataclasses/src

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    geom: heavy geometric tests (require full CAD/planning stack)
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests
    gpu: needs an NVIDIA GPU (cuMotion, training); skipped in CI, run locally
    network: needs internet access, off by default (opt in per test with its own environment variable)

filterwarnings =
    error:Assembly\.\w+ is deprecated:DeprecationWarning
