[Settings]
spawn_point_file = spawn_pointEMO.npy
spawn_orient_file = spawn_orientEMO.npy
# venv the HMI uses to launch DisassemblySim.py (relative to robotics_env/).
# Use .venv (Python 3.14, cumotion 1.1.0 cp314 installed).
# schedulestream_env is the Python 3.10 fallback — functional but redundant.
sim_venv = .venv

# Planner workers (techstack #212, ADR-0011): motion planners that run as their own process (cuRobo,
# cuMotion, OMPL), one line each, "name = host:port". A configure_planner request then chooses one by
# its name; "planner_worker" with an "address" option reaches any other. Example: curobo = 127.0.0.1:5801
[planner_workers]
